# Auvyx Mono — cấu hình bản fork của Lilex
# Chạy: make auvyx         (dùng font Lilex có sẵn trong fonts/Lilex)
#       make auvyx-build   (build Lilex từ source rồi tạo Auvyx Mono)

family: Auvyx Mono          # Tên hiển thị
postscript: AuvyxMono       # Tên không dấu cách (dùng cho tên file, PostScript name)
source_family: Lilex        # Tên gốc cần thay

copyright: Copyright 2026 Ethan Lam
designer: Ethan Lam
vendor_url: ""              # để trống = xoá URL vendor của Lilex

# Các biến thể được "gắn cứng" làm mặc định.
# Bật lại feature đó trong editor sẽ trả về glyph gốc của Lilex.
# Xem danh sách trong sources/opentype_features/cv*.fea, ss*.fea, zero.fea
default_features:
  upright:
    - cv02   # Open g (g một tầng, đuôi mở)
  italic: []  # bộ nghiêng của Lilex vốn đã dùng g một tầng

# Glyph nghiêng được thay bằng glyph đứng xiên theo góc nghiêng (9.5°)
italic_from_upright:
  - x      # bỏ chữ x uốn lượn, dùng x thẳng

# Bỏ chân serif ở baseline
remove_foot:
  upright:
    - f

# Ghép glyph từ font OFL khác. Outline được khớp độ đậm (theo độ dày thân chữ)
# và khớp chiều cao (x-height, ascender, descender) với Lilex.
import_glyphs:
  - name: Recursive
    source: sources/external/recursive/Recursive_VF_1.085.ttf   # OFL, xem OFL.txt cùng thư mục
    styles: [italic]
    location: {MONO: 1, CASL: 0, slnt: -9.5, CRSV: 0}          # Rec Mono Linear, nghiêng 9.5° như Lilex
    masters: {100: 238, 400: 367, 700: 750}                    # wght Lilex → wght Recursive (<300 là ngoại suy)
    zones:
      source: [-200, 0, 532, 750]                              # descender, baseline, x-height, ascender
      target: [-200, 0, 522, 740]
    chars: "kljrvwt łŧţȷ"

extra_copyright:
  - "Glyphs k l j r v w t (italic) from Recursive: Copyright 2020 The Recursive Project Authors (https://github.com/arrowtype/recursive)."
