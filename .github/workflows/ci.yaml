name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: pip install fonttools brotli pyyaml uharfbuzz numpy freetype-py pillow
      - name: Build Auvyx Mono
        run: make auvyx
      - name: Build website
        run: |
          make website-configure
          make website-fonts
          make website-build
      - uses: actions/upload-artifact@v7
        with:
          name: AuvyxMono
          path: fonts/AuvyxMono/
      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: website/dist/
